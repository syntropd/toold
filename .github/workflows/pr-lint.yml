name: pr-lint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            style
          requireScope: false
          subjectPattern: ^(?!\s).{8,}$
          subjectPatternError: |
            Subject must be at least 8 characters and must not start
            with whitespace.
          bodyPattern: ^[\s\S]*$
          validateSingleCommit: false
